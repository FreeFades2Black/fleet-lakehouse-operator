name: Ring 0 Ephemeral Canary E2E Delivery Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  static-policy-conformance:
    name: Static Policy & Helm Matrix Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm 3
        uses: azure/setup-helm@v4

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0

      - name: Render Helm Manifests & Evaluate Kyverno Baseline
        run: |
          echo "==> Rendering Canary manifests via Helm template..."
          helm template canary-gate helm/lakehouse-substrate/ \
            -f helm/lakehouse-substrate/values-canary.yaml \
            --namespace lakehouse-system > /tmp/canary-manifests.yaml
          
          echo "==> Auditing rendered Kubernetes manifests against Kyverno DoD Platform One STIG..."
          kyverno apply security/kyverno/dod-ironbank-baseline.yaml --resource /tmp/canary-manifests.yaml

      - name: Lint & Dry-Run Matrix Across 50 Cluster Overrides
        run: |
          echo "==> Running Helm lint on substrate chart..."
          helm lint helm/lakehouse-substrate/ -f helm/lakehouse-substrate/values-canary.yaml
          
          echo "==> Simulating dry-run template render across 50 fleet cluster specs..."
          python -c "
          import json, os, subprocess
          for f in sorted(os.listdir('argocd/clusters')):
              with open(os.path.join('argocd/clusters', f)) as jf:
                  data = json.load(jf)
              site = data['siteId']
              ring = data['labels']['ring']
              cmd = ['helm', 'template', 'canary-test', 'helm/lakehouse-substrate/',
                     '--set', f'global.siteId={site}', '--set', f'global.environment={ring}']
              res = subprocess.run(cmd, capture_output=True, text=True)
              if res.returncode != 0:
                  print(f'FAILED on {site}: {res.stderr}')
                  exit(1)
          print('All 50 cluster override matrix templates rendered successfully.')
          "

  e2e-canary-spinup:
    name: Canary Ring 0 KinD Cluster Gate
    needs: static-policy-conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up KinD Cluster
        uses: helm/kind-action@v1.9.0
        with:
          config: tests/kind-ring0-config.yaml
          cluster_name: ring0-canary
          wait: 120s

      - name: Surface Cluster Nodes and Topology
        run: |
          echo "==> KinD 3-Node Topology Ready:"
          kubectl get nodes -o wide --show-labels
          kubectl describe nodes | grep -E "Allocatable|Taints|zone"

      - name: Deploy Strimzi Kafka CRDs & Policy Definitions
        run: |
          echo "==> Installing Strimzi Kafka CustomResourceDefinitions..."
          kubectl apply -f https://github.com/strimzi/strimzi-kafka-operator/releases/download/0.40.0/strimzi-crds-0.40.0.yaml
          
          echo "==> Deploying DoD Iron Bank Policy Manifests..."
          kubectl apply -f security/kyverno/dod-ironbank-baseline.yaml || true

      - name: Deploy Lakehouse Substrate Helm Chart
        run: |
          echo "==> Creating target lakehouse namespaces..."
          kubectl create namespace lakehouse-system || true
          
          echo "==> Deploying Lakehouse Substrate to Canary Ring 0..."
          helm upgrade --install lakehouse-canary helm/lakehouse-substrate \
            -f helm/lakehouse-substrate/values-canary.yaml \
            --create-namespace --namespace lakehouse-system

      - name: Await Pod Scheduling & Storage Binding
        run: |
          echo "==> Tracking Kubernetes scheduling events and CSI volume bindings..."
          kubectl get events -n lakehouse-system --sort-by='.metadata.creationTimestamp' || true
          kubectl get pods,pvc -n lakehouse-system -o wide || true

      - name: Execute In-Cluster Delivery Verification Probe
        run: |
          echo "==> Installing delivery-cli requirements..."
          pip install -r delivery-cli/requirements.txt
          
          echo "==> Executing delivery-cli synthetic verification harness inside Canary Pod..."
          python delivery-cli/delivery_cli.py \
            --cluster-context ring0-canary \
            --verify-all \
            --json
