apiVersion: apps/v1
kind: Deployment
metadata:
  name: nessie-iceberg-catalog
  namespace: lakehouse-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nessie-catalog
  template:
    metadata:
      labels:
        app: nessie-catalog
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: nessie
          image: projectnessie/nessie:0.81.0
          ports:
            - containerPort: 19120
              name: http
          env:
            - name: NESSIE_VERSION_STORE_TYPE
              value: ROCKSDB
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: catalog-data
              mountPath: /nessie-data
      volumes:
        - name: catalog-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nessie-catalog
  namespace: lakehouse-system
spec:
  ports:
    - port: 19120
      targetPort: 19120
  selector:
    app: nessie-catalog
