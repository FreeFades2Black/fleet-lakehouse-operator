apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: fleet-kafka-cluster
  namespace: lakehouse-system
spec:
  kafka:
    version: 3.7.0
    replicas: {{ .Values.kafka.replicas }}
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
    config:
      offsets.topic.replication.factor: {{ .Values.kafka.replicas }}
      transaction.state.log.replication.factor: {{ .Values.kafka.replicas }}
      transaction.state.log.min.isr: 2
      default.replication.factor: {{ .Values.kafka.replicas }}
      min.insync.replicas: 2
      log.retention.hours: {{ .Values.kafka.retention.hours }}
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: {{ .Values.kafka.storage.size }}
          class: {{ .Values.global.storageClassName }}
          deleteClaim: false
    template:
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          fsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
