kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ring0-canary
nodes:
- role: control-plane
  image: kindest/node:v1.29.2
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "topology.kubernetes.io/zone=us-gov-east-1a,ring=ring-0-canary"
  extraPortMappings:
  - containerPort: 30080
    hostPort: 30080
    protocol: TCP
  - containerPort: 30092
    hostPort: 30092
    protocol: TCP
- role: worker
  image: kindest/node:v1.29.2
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "topology.kubernetes.io/zone=us-gov-east-1a,lakehouse.role=storage,ring=ring-0-canary"
  extraMounts:
  - hostPath: /tmp/kind-storage-w1
    containerPath: /mnt/nvme-spill
- role: worker
  image: kindest/node:v1.29.2
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "topology.kubernetes.io/zone=us-gov-east-1b,lakehouse.role=compute,ring=ring-0-canary"
  extraMounts:
  - hostPath: /tmp/kind-storage-w2
    containerPath: /mnt/nvme-spill
